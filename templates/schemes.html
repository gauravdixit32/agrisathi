{% extends "base.html" %}
{% block content %}
<h2 style="text-align:center;margin-top:20px;">Government Schemes</h2>
<div class="card">
  <input id="search" placeholder="Search schemes..." onkeyup="filterSchemes()" style="width:100%; padding:8px; margin-bottom:10px;">
  <table id="schemesTable">
    <tr><th>Name</th><th>Description</th><th>Eligibility</th><th>State</th></tr>
    {% for s in schemes %}
      <tr>
        <td>{{ s.scheme_name }}</td>
        <td>{{ s.description }}</td>
        <td>
          Age: {{ s.min_age }} - {{ s.max_age }}
          | Land: {{ s.min_land }} - {{ s.max_land }}
        </td>
        <td>{{ s.state }}</td>
      </tr>
    {% endfor %}
  </table>
</div>

<script>
function filterSchemes(){
  var input = document.getElementById('search').value.toLowerCase();
  var rows = document.querySelectorAll('#schemesTable tr');
  for(var i=1;i<rows.length;i++){
    rows[i].style.display = rows[i].innerText.toLowerCase().includes(input) ? '' : 'none';
  }
}
</script>
{% endblock %}
